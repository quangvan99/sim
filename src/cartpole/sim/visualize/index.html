<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CartPole Viewer</title>

    <script src="https://cdn.rawgit.com/dcodeIO/protobuf.js/6.8.8/dist/protobuf.min.js"></script>
    <script src="vendor/eventemitter2.min.js"></script>
    <script src="vendor/gz.js"></script>
    <script src="vendor/gz3d.js"></script>
    <link rel="stylesheet" href="styles.css" />

  </head>

  <body>
    <header id="topbar">
      <span id="status">Connecting...</span>
      <div id="rl-bar" hidden>
        <div id="rl-phase-group" role="status" aria-live="polite">
          <span id="rl-status-dot" title="Loading"></span>
          <strong id="rl-phase">LOADING</strong>
        </div>
        <div id="rl-live-data">
          <span id="rl-pole-angle">Pole 0.0°</span>
          <span id="rl-action">— 0 N</span>
          <span id="rl-time">00.0s</span>
        </div>
        <span id="rl-result" hidden></span>
        <div id="rl-actions" aria-label="CartPole RL controls">
          <button id="rl-start" type="button" title="Start" aria-label="Start">▶</button>
          <button id="rl-reset" type="button" title="Reset" aria-label="Reset">↺</button>
          <button id="rl-push-left" type="button" title="Push Left" aria-label="Push Left">←</button>
          <button id="rl-push-right" type="button" title="Push Right" aria-label="Push Right">→</button>
        </div>
      </div>
    </header>
    <div id="controls" aria-label="CartPole manual controls" hidden>
      <button type="button" data-force="-2000">◀ Left</button>
      <button type="button" data-force="2000">Right ▶</button>
      <button type="button" data-force="0">Stop</button>
      <button type="button" id="reset-button">Reset</button>
      <span id="control-state">Force: 0 N</span>
      <span id="control-help">Arrow keys · Space stop</span>
    </div>
    <div id="viewer"></div>
    <script src="app.js"></script>

  </body>
</html>
