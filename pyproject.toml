[project]
name = "amr"
version = "1.0.0"
description = "Gazebo-native AMR navigation simulator"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=2.3,<3",
  "protobuf>=7.36.0,<8",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "server", "transport"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
sim = [
  "models/**/*.sdf",
  "models/**/*.config",
  "models/**/*.stl",
  "visualize/**/*.html",
  "visualize/**/*.js",
  "visualize/**/*.css",
  "maps/*.json",
  "worlds/*.sdf",
]
